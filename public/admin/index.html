<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c0b">
<title>ExitCube — заявки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c0b'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23ffd400' stroke-width='3'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' fill='%2335e85a'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Rubik;font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/rubik-hebrew-wght-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/rubik-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Rubik;font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/rubik-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#0a0c0b;--panel:#121514;--panel-2:#181c1a;--line:#262b28;--ink:#f3f5f2;--dim:#a3aca6;--volt:#ffd400;--neon:#35e85a;--bad:#ff6b5e;--r:14px;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:rgba(10,12,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.04em;font-size:20px}
.logo b{color:var(--neon);font-weight:800}
.bar .sp{flex:1}
.tag{font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:#3a423d}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
button.primary{background:var(--volt);color:#111;border-color:var(--volt)}
button.ghost{background:transparent}
button.danger{color:var(--bad);background:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical;line-height:1.4}

/* sign-in */
.login{max-width:420px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px}
.login h1{margin:0 0 6px;font-size:24px}
.login p{margin:0 0 18px;color:var(--dim);font-size:15px}
.login .row{display:flex;gap:10px;margin-top:12px}
.login input{font-size:24px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.msg{min-height:22px;margin-top:12px;font-size:15px;color:var(--dim)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--neon)}

/* list */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;min-height:0;display:block;font-weight:400}
.stat .n{display:block;font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat[aria-pressed=true]{border-color:var(--neon);box-shadow:inset 0 0 0 1px var(--neon)}
.tools{display:flex;gap:8px;margin-bottom:14px}
.tools input{flex:1}
.empty{color:var(--dim);text-align:center;padding:50px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;border-inline-start:4px solid var(--line)}
.card[data-s=new]{border-inline-start-color:var(--neon)}
.card[data-s=contacted]{border-inline-start-color:var(--volt)}
.card[data-s=waiting]{border-inline-start-color:#5aa9ff}
.card[data-s=booked]{border-inline-start-color:#c58bff}
.card[data-s=closed]{opacity:.62}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name{font-size:19px;font-weight:700}
.num,.when{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.when{margin-inline-start:auto}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 10px;font-size:15px;color:var(--dim)}
.facts b{color:var(--ink);font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.acts .wa{background:#12301c;border-color:#1f5a33;color:#8ff0ad}
.note{margin-top:8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.saved{font-size:13px;color:var(--neon);min-height:18px}
.foot button{min-height:36px;padding:4px 10px;font-size:14px;border:0}
@media(max-width:560px){.stat .n{font-size:20px}.acts{grid-template-columns:1fr 1fr}.acts select{grid-column:1/-1}.tag{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">EXIT<b>CUBE</b></div><span class="tag">заявки</span><span class="sp"></span>
  <button id="csv" class="ghost" hidden>CSV</button>
  <button id="out" class="ghost" hidden>Выйти</button>
</div></header>

<main class="wrap">
  <section id="login" class="login" hidden>
    <h1>Вход</h1>
    <p>Код придёт в Telegram от бота ExitCube — туда же, куда приходят заявки.</p>
    <button id="getcode" class="primary" style="width:100%">Получить код в Telegram</button>
    <form id="codeform" hidden>
      <div class="row"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" aria-label="Код из Telegram"></div>
      <div class="row"><button class="primary" style="flex:1">Войти</button></div>
    </form>
    <div id="lmsg" class="msg" role="status"></div>
  </section>

  <section id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="tools"><input id="q" type="search" placeholder="Поиск: имя, телефон, город, заметка" aria-label="Поиск"><button id="reload" class="ghost" aria-label="Обновить">↻</button></div>
    <div id="list"></div>
  </section>
</main>

<script>
(function(){
  var ST={new:"Новые",contacted:"Связался",waiting:"Ждут запуска",booked:"Бронь",closed:"Закрыты"};
  var ST1={new:"Новая",contacted:"Связался",waiting:"Ждёт запуска",booked:"Бронь",closed:"Закрыта"};
  var $=function(id){return document.getElementById(id)};
  var leads=[],filter="",query="";

  function api(path,body){
    return fetch("/api/admin/"+path,{method:body?"POST":"GET",credentials:"same-origin",
      headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return{ok:false,error:"net"}}).then(function(j){j.status=r.status;return j})})
      .catch(function(){return{ok:false,error:"net",status:0}});
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function show(which){$("login").hidden=which!=="login";$("app").hidden=which!=="app";$("csv").hidden=$("out").hidden=which!=="app"}
  function lmsg(text,kind){var m=$("lmsg");m.textContent=text||"";m.className="msg"+(kind?" "+kind:"")}
  function when(iso){try{return new Date(iso).toLocaleString("ru-RU",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}

  function load(){
    return api("leads").then(function(j){
      if(j.status===401){show("login");return}
      if(!j.ok){show("app");$("list").replaceChildren(el("div","empty","Не удалось загрузить заявки. Проверь связь и нажми ↻."));return}
      leads=j.leads;show("app");render();
    });
  }

  function render(){
    var counts={};leads.forEach(function(l){counts[l.status]=(counts[l.status]||0)+1});
    var stats=$("stats");stats.replaceChildren();
    Object.keys(ST).forEach(function(s){
      var b=el("button","stat");b.type="button";b.setAttribute("aria-pressed",String(filter===s));
      b.append(el("span","n",String(counts[s]||0)),el("span","l",ST[s]));
      b.onclick=function(){filter=filter===s?"":s;render()};stats.append(b);
    });
    var q=query.trim().toLowerCase();
    var rows=leads.filter(function(l){
      if(filter&&l.status!==filter)return false;
      if(!q)return true;
      return [l.name,l.phone,l.city,l.note,String(l.id)].join(" ").toLowerCase().indexOf(q)>=0;
    });
    var list=$("list");list.replaceChildren();
    if(!rows.length){list.append(el("div","empty",leads.length?"По этому фильтру заявок нет.":"Заявок пока нет. Новые появятся здесь и придут в Telegram."));return}
    rows.forEach(function(l){list.append(card(l))});
  }

  function fact(label,value){var s=el("span");s.append(label+" ");s.append(el("b",null,value||"—"));return s}

  function card(l){
    var c=el("article","card");c.dataset.s=l.status;
    var top=el("div","top");top.append(el("span","name",l.name||"Без имени"),el("span","num","№"+l.id),el("span","when",when(l.created_at)));
    var facts=el("div","facts");
    var city=el("span");city.append("Город ");var cb=el("b",null,l.city||"—");cb.dir="auto";city.append(cb);
    facts.append(fact("Тел.",l.phone),city,fact("Детей",l.kids==null?"":String(l.kids)),fact("Возраст",l.age),fact("Миссия",l.mission_name),fact("Язык",l.lang_name));
    var acts=el("div","acts");
    var wa=el("a","btn wa","WhatsApp");wa.href="https://wa.me/"+l.wa;wa.target="_blank";wa.rel="noopener";
    var call=el("a","btn","Позвонить");call.href="tel:"+l.phone;
    var sel=el("select");sel.setAttribute("aria-label","Статус заявки №"+l.id);
    Object.keys(ST1).forEach(function(s){var o=el("option",null,ST1[s]);o.value=s;if(s===l.status)o.selected=true;sel.append(o)});
    acts.append(wa,call,sel);
    var note=el("textarea","note");note.placeholder="Заметка: о чём договорились, когда перезвонить";note.value=l.note||"";note.maxLength=500;note.setAttribute("aria-label","Заметка к заявке №"+l.id);
    var foot=el("div","foot"),saved=el("span","saved"),del=el("button","danger","Удалить");del.type="button";
    foot.append(saved,del);
    function flash(ok){saved.textContent=ok?"Сохранено":"Не сохранилось — проверь связь";saved.style.color=ok?"":"var(--bad)";if(ok)setTimeout(function(){saved.textContent=""},1800)}
    sel.onchange=function(){api("update",{id:l.id,status:sel.value}).then(function(j){if(j.status===401)return show("login");if(j.ok){l.status=sel.value;render()}else flash(false)})};
    note.onchange=function(){api("update",{id:l.id,note:note.value}).then(function(j){if(j.status===401)return show("login");if(j.ok)l.note=note.value;flash(j.ok)})};
    del.onclick=function(){
      if(!confirm("Удалить заявку №"+l.id+" ("+(l.name||l.phone)+") навсегда? Вернуть будет нельзя."))return;
      api("delete",{id:l.id}).then(function(j){if(j.status===401)return show("login");if(j.ok){leads=leads.filter(function(x){return x.id!==l.id});render()}else flash(false)});
    };
    c.append(top,facts,acts,note,foot);return c;
  }

  $("getcode").onclick=function(){
    var b=this;b.disabled=true;lmsg("Отправляю…");
    api("code",{}).then(function(j){
      b.disabled=false;
      if(j.ok||j.error==="wait"){$("codeform").hidden=false;$("code").focus();lmsg(j.ok?"Код отправлен в Telegram. Действует 5 минут.":"Код уже отправлен меньше минуты назад — посмотри в Telegram.","ok")}
      else if(j.error==="no_telegram")lmsg("Бот не смог отправить код. Открой бота ExitCube в Telegram, нажми Start и попробуй ещё раз.","err");
      else lmsg("Не получилось. Проверь связь и попробуй ещё раз.","err");
    });
  };
  $("codeform").onsubmit=function(e){
    e.preventDefault();
    var code=$("code").value.replace(/\D/g,"");
    if(code.length!==6){lmsg("В коде 6 цифр.","err");return}
    lmsg("Проверяю…");
    api("login",{code:code}).then(function(j){
      if(j.ok){$("code").value="";$("codeform").hidden=true;lmsg("");load()}
      else if(j.error==="wrong")lmsg("Код не подошёл. Осталось попыток: "+j.left+".","err");
      else if(j.error==="expired"){$("codeform").hidden=true;lmsg("Код устарел. Запроси новый.","err")}
      else lmsg("Не получилось. Проверь связь и попробуй ещё раз.","err");
    });
  };
  $("out").onclick=function(){api("logout",{}).then(function(){leads=[];show("login");lmsg("")})};
  $("reload").onclick=load;
  $("q").oninput=function(){query=this.value;render()};
  $("csv").onclick=function(){
    var head=["№","Дата","Имя","Телефон","Город","Детей","Возраст","Миссия","Язык","Статус","Заметка"];
    var rows=leads.map(function(l){return[l.id,when(l.created_at),l.name,l.phone,l.city,l.kids,l.age,l.mission_name,l.lang_name,ST1[l.status]||l.status,l.note]});
    var csv=[head].concat(rows).map(function(r){return r.map(function(v){v=v==null?"":String(v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="exitcube-zayavki.csv";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  };
  load();
})();
</script>
</body>
</html>
